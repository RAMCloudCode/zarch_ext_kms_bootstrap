[project]
name = "zarch_ext_kms_bootstrap"
version = "0.1.0"
description = "Z-Arch extension: kms-bootstrap"
requires-python = ">=3.11"
dependencies = ["zarch>=0.1.0"]

[project.entry-points."zarch.extensions"]
kms-bootstrap = "zarch_ext_kms_bootstrap:Extension"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["zarch_ext_kms_bootstrap"]
